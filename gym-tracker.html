<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1efec">
<meta name="color-scheme" content="light dark">
<title>IRONLOG</title>
<!-- Home Screen app. apple-mobile-web-app-capable is what actually drops the Safari chrome on
     iOS; the manifest matters for everything else. Status bar stays 'default' on purpose -
     'black-translucent' forces white status-bar text, which is unreadable on this light wash. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="IRONLOG">
<link rel="apple-touch-icon" href="icon-180.png"><!-- deliberately points at a file that is not shipped: iOS needs a real PNG here and none could be generated, so until you drop a 180x180 icon-180.png beside the app iOS uses a screenshot of the page as the icon -->
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f1efec; --card:rgba(255,255,255,.66); --card2:rgba(255,255,255,.44); --ink:#14171c; --mut:#6b6660;
  --line:rgba(20,23,28,.10); --acc:#c2410c; --acc2:#9a3412; --accbg:rgba(194,65,12,.10);
  --ok:#15803d; --okbg:rgba(21,128,61,.10); --warn:#a16207; --bad:#b91c1c;
  --tap:46px; --r:16px;
  --sh:0 1px 1px rgba(20,23,28,.04), 0 6px 20px rgba(20,23,28,.05);
  /* glass */
  --glass:rgba(255,255,255,.72); --glass2:rgba(255,255,255,.55); --sheet:rgba(252,251,250,.88);
  --hair:rgba(20,23,28,.09); --edge:rgba(255,255,255,.75); --track:rgba(20,23,28,.13);
  --blur:saturate(180%) blur(22px);
  --solid:#ffffff; --solid2:#f7f5f2; --inset:rgba(20,23,28,.045);
  --w1:rgba(255,214,180,.55); --w2:rgba(190,214,240,.45); --w3:rgba(214,232,214,.40);
}
[data-theme="dark"]{
  --bg:#0d1014; --card:rgba(30,35,43,.66); --card2:rgba(255,255,255,.055); --ink:#eceff4; --mut:#98a0ad;
  --line:rgba(255,255,255,.10); --acc:#fb923c; --acc2:#fdba74; --accbg:rgba(251,146,60,.14);
  --ok:#4ade80; --okbg:rgba(74,222,128,.13); --warn:#fbbf24; --bad:#f87171;
  --sh:0 1px 1px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --glass:rgba(28,33,41,.72); --glass2:rgba(255,255,255,.07); --sheet:rgba(20,24,30,.90);
  --hair:rgba(255,255,255,.11); --edge:rgba(255,255,255,.10); --track:rgba(255,255,255,.16);
  --solid:#171b21; --solid2:#1d222a; --inset:rgba(255,255,255,.055);
  --w1:rgba(120,60,20,.40); --w2:rgba(30,60,100,.38); --w3:rgba(24,64,48,.30);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:var(--bg)}
body{
  background:transparent; color:var(--ink); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums; -webkit-text-size-adjust:100%;
  padding:calc(env(safe-area-inset-top) + 52px) 0 calc(env(safe-area-inset-bottom) + 74px);
  overscroll-behavior-y:contain;
}
/* the soft wash the glass has something to blur - fixed, so it never scrolls */
body::before{content:'';position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60% 45% at 14% 2%, var(--w1) 0%, transparent 64%),
    radial-gradient(55% 40% at 96% 8%, var(--w2) 0%, transparent 62%),
    radial-gradient(60% 40% at 45% 100%, var(--w3) 0%, transparent 64%);}
[hidden]{display:none!important}
h1,h2,h3{margin:0;letter-spacing:-.02em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:active{opacity:.7}
input,select,textarea{font-size:16px;font-family:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
select{-webkit-appearance:none;appearance:none;background-image:none}
input[type=checkbox]{width:auto;accent-color:var(--acc)}
input[type=file]{padding:8px;background:var(--card2)}
textarea{min-height:64px;resize:vertical;line-height:1.4}
.wrap{max-width:620px;margin:0 auto;padding:0 12px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.b{font-weight:700}
.tnum{font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center}
.row.wrap2{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* --- app bar --- */
#bar{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--glass);border-bottom:1px solid var(--hair);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  padding-top:env(safe-area-inset-top)}
#bar .in{max-width:620px;margin:0 auto;height:52px;display:flex;align-items:center;gap:10px;padding:0 12px}
#bar h1{font-size:17px;font-weight:800}
#bar h1 span{color:var(--acc)}
#barsub{font-size:11.5px;color:var(--mut);margin-top:-2px}
.iconbtn{min-width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);background:var(--card2);font-size:15px}
/* --- bottom nav --- */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--glass);border-top:1px solid var(--hair);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  padding-bottom:env(safe-area-inset-bottom)}
#nav .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
#nav button{height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:9.5px;font-weight:700;color:var(--mut);letter-spacing:0}
#nav button i{font-style:normal;font-size:17px;line-height:1}
#nav button[aria-selected="true"]{color:var(--acc)}
#nav button[aria-selected="true"] i{transform:translateY(-1px)}
/* --- cards --- */
.card{background:var(--card);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--sh),inset 0 1px 0 var(--edge);
  -webkit-backdrop-filter:saturate(150%) blur(14px);backdrop-filter:saturate(150%) blur(14px);
  padding:14px;margin:11px 0}
.card.tight{padding:11px}
/* inside a sheet the glass is already opaque, so cards read as recessed groups instead */
.sheet .card{background:var(--inset);box-shadow:inset 0 1px 0 var(--edge);
  -webkit-backdrop-filter:none;backdrop-filter:none}
.stepn{flex:0 0 auto;width:23px;height:23px;border-radius:999px;background:var(--acc);color:#fff;
  font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
[data-theme="dark"] .stepn{color:#1b1206}
.ttl{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.btn{min-height:var(--tap);padding:0 16px;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent}
[data-theme="dark"] .btn{color:#1b1206}
.btn.ghost{background:var(--card2);color:var(--ink);border-color:var(--line)}
.btn.ghost2{background:transparent;color:var(--acc);border-color:var(--acc)}
.btn.dang{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm2{min-height:36px;padding:0 11px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.btn:active{transform:translateY(1px)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:var(--card2);
  border:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--mut);white-space:nowrap}
.chip.acc{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
.chip.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.seg::-webkit-scrollbar{display:none}
.seg button{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  font-size:12.5px;font-weight:700;color:var(--mut);white-space:nowrap;flex:0 0 auto}
.seg button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
[data-theme="dark"] .seg button[aria-pressed="true"]{color:#1b1206}
/* --- stat tiles --- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px}
.tile .k{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.tile .v{font-size:21px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.tile .v small{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:0}
.tile .n{font-size:11.5px;color:var(--mut);margin-top:1px}
/* --- calendar --- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dw{text-align:center;font-size:10px;font-weight:800;color:var(--mut);padding-bottom:3px;letter-spacing:.05em}
.cell{position:relative;aspect-ratio:1/1.05;border:1px solid var(--line);border-radius:9px;background:var(--card2);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 2px 2px;gap:2px;min-height:42px}
.cell.pad{background:transparent;border-color:transparent}
.cell .d{font-size:12px;font-weight:700;line-height:1}
.cell .dot{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.cell .tag{font-size:8.5px;font-weight:800;color:var(--acc);line-height:1.05;text-align:center;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 1px}
.cell.has{background:var(--accbg);border-color:var(--acc)}
.cell.rest{border-style:dashed}
.cell.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--acc)}
.cell .st{font-size:8.5px;color:var(--mut);font-weight:700;line-height:1}
/* --- set rows --- */
.exc{border:1px solid var(--line);border-radius:12px;background:var(--card2);margin:9px 0;overflow:hidden}
.exh{display:flex;gap:8px;align-items:flex-start;padding:10px 10px 8px}
.exh .nm{font-size:15px;font-weight:800;letter-spacing:-.01em}
.hints{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 10px 9px}
.hint{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 7px;min-width:0}
.hint .k{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.hint .v{font-size:12.5px;font-weight:700;margin-top:2px;line-height:1.25;overflow-wrap:anywhere}
.sets{padding:0 10px 10px}
.srow{display:grid;grid-template-columns:30px 1fr 1fr 42px 30px;gap:6px;align-items:center;margin-bottom:6px}
.srow.hd{margin-bottom:4px}
.srow.hd span{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:center}
.snum{min-height:38px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;color:var(--mut)}
.snum.w{color:var(--warn);border-color:var(--warn)}
.srow input{min-height:40px;text-align:center;background:var(--card);padding:8px 4px}
.tick{min-height:40px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:16px;
  display:flex;align-items:center;justify-content:center;color:var(--mut)}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
[data-theme="dark"] .tick[aria-pressed="true"]{color:#07130c}
.xbtn{min-height:38px;border-radius:9px;color:var(--mut);font-size:15px;display:flex;align-items:center;justify-content:center}
/* --- progress rows --- */
.prow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px;border:1px solid var(--line);
  border-radius:12px;background:var(--card2);margin-bottom:8px}
.prow .sp{flex:0 0 74px}
.vv{font-size:15px;font-weight:800;white-space:nowrap}
.prow .vv{font-size:15px;font-weight:800;white-space:nowrap}
.verd{font-size:12px;font-weight:700;margin-top:2px}
.verd.up{color:var(--ok)} .verd.dn{color:var(--bad)} .verd.flat{color:var(--warn)} .verd.new{color:var(--mut)}
.bars{display:flex;gap:3px;align-items:flex-end;height:26px}
.bars i{flex:1;background:var(--acc);border-radius:2px;min-height:2px;opacity:.85;display:block}
/* --- progression bars and rings --- */
.ring{width:66px;height:66px;flex:0 0 auto;display:block}
.dbar{position:relative;height:9px;background:var(--track);border-radius:99px;margin-top:5px;
  border:1px solid var(--hair)}
.dbar b{position:absolute;top:0;bottom:0;border-radius:99px;min-width:2px}
.dbar u{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--mut);opacity:.5}
.gb{position:relative;height:9px;background:var(--track);border-radius:99px;overflow:hidden;
  border:1px solid var(--hair);margin-top:4px}
.gb i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--acc);display:block}
.gb i.low{background:var(--warn)}
.grow0{flex:0 0 auto}
.dl{display:flex;gap:8px;align-items:baseline}
.dl .fl{flex:1 1 auto;min-width:0}
.dl .p{font-size:13px;font-weight:800;white-space:nowrap;min-width:52px;text-align:right}
/* --- lists --- */
.li{display:flex;gap:9px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:11px;
  background:var(--card2);margin-bottom:7px}
.li.plain{background:transparent;border-color:transparent;padding:6px 0;margin:0;border-bottom:1px solid var(--line);border-radius:0}
/* --- sheet / modal --- */
#scrim{position:fixed;inset:0;z-index:50;background:rgba(12,14,18,.34);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--sheet);border-radius:22px 22px 0 0;
  -webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);
  border-top:1px solid var(--edge);box-shadow:0 -12px 40px rgba(0,0,0,.18);max-height:88vh;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom)}
.sheet .sh{display:flex;gap:8px;align-items:center;padding:12px 12px 8px;border-bottom:1px solid var(--hair)}
.sheet .sh h2{font-size:16px;font-weight:800;flex:1;min-width:0}
.sheet .sb{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 16px}
.grab{width:38px;height:5px;border-radius:99px;background:var(--track);margin:7px auto 0}
/* --- rest bar --- */
#rest{position:fixed;left:0;right:0;z-index:41;bottom:calc(env(safe-area-inset-bottom) + 60px);
  background:var(--ink);color:var(--bg);padding:9px 12px;display:flex;gap:10px;align-items:center;
  max-width:620px;margin:0 auto;border-radius:12px 12px 0 0}
#rest .t{font-size:20px;font-weight:800;letter-spacing:-.02em;min-width:58px}
#rest button{color:var(--bg);border:1px solid rgba(255,255,255,.35);border-radius:9px;min-height:34px;padding:0 10px;font-size:12.5px;font-weight:700}
[data-theme="dark"] #rest button{border-color:rgba(0,0,0,.3)}
/* --- storage alarm --- */
#alert{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 52px);z-index:45;max-width:620px;margin:0 auto;
  background:var(--bad);color:#fff;padding:9px 12px;display:flex;gap:9px;align-items:center;font-size:12.5px;
  font-weight:700;line-height:1.3}
#alert button{color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:8px;min-height:32px;padding:0 10px;
  font-size:12px;font-weight:800;flex:0 0 auto}
/* --- toast --- */
#toast{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 68px);z-index:60;
  max-width:596px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 12px;
  display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.28)}
#toast .m{flex:1;font-size:13.5px;font-weight:600}
#toast button{color:var(--bg);font-weight:800;font-size:13px;text-decoration:underline;padding:6px 2px;min-height:34px}
/* --- misc --- */
.empty{text-align:center;padding:22px 14px;color:var(--mut);font-size:13.5px}
.empty .big{font-size:26px;margin-bottom:6px}
svg.ch{width:100%;height:auto;display:block;overflow:visible}
.lbl{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);display:block;margin-bottom:5px}
.fld{margin-bottom:10px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:5px 6px 5px 0;font-weight:800}
.tbl td{padding:6px 6px 6px 0;border-top:1px solid var(--line);vertical-align:top}
@media(prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(14px)}}}
/* --- if the browser cannot frost, fall back to solid surfaces so nothing turns unreadable --- */
@supports not ((-webkit-backdrop-filter:blur(2px)) or (backdrop-filter:blur(2px))){
  :root{--card:var(--solid);--card2:var(--solid2);--glass:var(--solid);--sheet:var(--solid2)}
  [data-theme="dark"]{--card:var(--solid);--card2:var(--solid2);--glass:var(--solid);--sheet:var(--solid2)}
  body::before{display:none}
}
/* --- respect Reduce Transparency in iOS accessibility settings --- */
@media(prefers-reduced-transparency:reduce){
  :root{--card:var(--solid);--card2:var(--solid2);--glass:var(--solid);--sheet:var(--solid2)}
  [data-theme="dark"]{--card:var(--solid);--card2:var(--solid2);--glass:var(--solid);--sheet:var(--solid2)}
  #bar,#nav,.sheet,.card{-webkit-backdrop-filter:none;backdrop-filter:none}
  body::before{display:none}
}
</style>
</head>
<body>

<header id="bar">
  <div class="in">
    <div class="grow">
      <h1>IRON<span>LOG</span></h1>
      <div id="barsub" aria-live="polite">Ready</div>
    </div>
    <button class="iconbtn" id="themeBtn" title="Theme" aria-label="Change theme">◐</button>
    <button class="iconbtn" id="todayBtn" title="Jump to today" aria-label="Jump to today">⌖</button>
  </div>
</header>

<div id="alert" hidden role="alert"><div class="grow" id="alertM"></div><button data-act="copy-json">Copy backup</button></div>

<main class="wrap">
  <section id="v-home" role="tabpanel" aria-labelledby="t-home"></section>
  <section id="v-cal" role="tabpanel" aria-labelledby="t-cal" hidden></section>
  <section id="v-log" role="tabpanel" aria-labelledby="t-log" hidden></section>
  <section id="v-prog" role="tabpanel" aria-labelledby="t-prog" hidden></section>
  <section id="v-food" role="tabpanel" aria-labelledby="t-food" hidden></section>
  <section id="v-more" role="tabpanel" aria-labelledby="t-more" hidden></section>
</main>

<div id="rest" hidden>
  <div class="t" id="restT">0:00</div>
  <div class="grow sm" id="restL">Rest</div>
  <button data-act="rest-add">+30s</button>
  <button data-act="rest-skip">Skip</button>
</div>

<div id="toast" hidden><div class="m" id="toastM"></div><button id="toastB" hidden>Undo</button></div>

<div id="scrim" hidden data-act="sheet-close"></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetT">
  <div class="grab"></div>
  <div class="sh"><h2 id="sheetT"></h2><button class="iconbtn" data-act="sheet-close" aria-label="Close">✕</button></div>
  <div class="sb" id="sheetB"></div>
</div>

<nav id="nav">
  <div class="in" role="tablist" aria-label="Sections">
    <button id="t-home" role="tab" data-go="home" aria-selected="true"  aria-controls="v-home"><i>◧</i>Home</button>
    <button id="t-cal"  role="tab" data-go="cal"  aria-selected="false" aria-controls="v-cal"><i>▦</i>Calendar</button>
    <button id="t-log"  role="tab" data-go="log"  aria-selected="false" aria-controls="v-log"><i>✎</i>Workout</button>
    <button id="t-food" role="tab" data-go="food" aria-selected="false" aria-controls="v-food"><i>◍</i>Food</button>
    <button id="t-prog" role="tab" data-go="prog" aria-selected="false" aria-controls="v-prog"><i>◭</i>Progress</button>
    <button id="t-more" role="tab" data-go="more" aria-selected="false" aria-controls="v-more"><i>≡</i>More</button>
  </div>
</nav>

<script>
/* Its own script block on purpose. A try/catch inside the main block below cannot catch a
   syntax error in that same block - the browser throws the whole block away before running a
   line of it, so the page would sit there looking finished and do nothing. window.onerror set

  var k=exKind(exId);
  if(k==='t'||k==='c')return n(r.top&&r.top.w);
  var L=n(r.ld),rp=n(r.top&&r.top.r);
  if(!(L>0))return rp;                                  /* nothing but reps to go on */
  return L*(1+Math.min(rp,20)/30);
}
function trend2(exId){ /* the last few sessions against the few before them */
  var h=hist(exId);
  if(h.length<4)return {short:true,have:h.length};
  var w=Math.min(3,Math.floor(h.length/2));
  var A=h.slice(-w),B=h.slice(-2*w,-w);
  var a=avg(A.map(function(r){return sScore(exId,r)})),b=avg(B.map(function(r){return sScore(exId,r)}));
  if(!(b>0))return {short:true,have:h.length};
  return {pct:(a-b)/b*100,w:w,from:B[0].date,to:A[A.length-1].date,
    dReps:avg(A.map(function(r){return n(r.top&&r.top.r)}))-avg(B.map(function(r){return n(r.top&&r.top.r)})),
    dLoad:avg(A.map(function(r){return n(r.ld)}))-avg(B.map(function(r){return n(r.ld)}))};
}
function grpSets(from,to){ /* completed working sets per muscle group */
  var g={},tot=0;
  S.ses.forEach(function(s){
    if(s.date<from||s.date>to)return;
    s.ent.forEach(function(e){
      var c=doneOf(e).length;if(!c)return;
      var x=exOf(e.exId),k=(x&&x.grp)||'Other';
      g[k]=(g[k]||0)+c;tot+=c;
    });
  });
  var out=[];for(var k2 in g)out.push({g:k2,n:g[k2]});
  out.sort(function(a,b){return b.n-a.n||(a.g<b.g?-1:1)});
  return {rows:out,total:tot};
}
/* total load = reps × load per rep, so the change splits cleanly between the two */
function loadSplit(f1,t1,f0,t0){
  function agg(f,t){
    var reps=0,load=0;
    S.ses.forEach(function(s){
      if(s.date<f||s.date>t)return;
      s.ent.forEach(function(e){
        var k=exKind(e.exId);if(k==='c'||k==='t')return;
        work(e).forEach(function(x){
          var r=n(x.r);if(!(r>0))return;
          reps+=r;load+=eff(e.exId,x,s.date)*r;
        });
      });
    });
    return {reps:reps,load:load,lpr:reps>0?load/reps:0};
  }
  var A=agg(f1,t1),B=agg(f0,t0);
  if(!(A.reps>0)||!(B.reps>0)||!(B.lpr>0))return null;
  return {a:A,b:B,dReps:(A.reps-B.reps)/B.reps*100,dLpr:(A.lpr-B.lpr)/B.lpr*100,
    dLoad:(A.load-B.load)/B.load*100};
}
function lastWorkout(){for(var i=S.ses.length-1;i>=0;i--)if(isWorkout(S.ses[i]))return S.ses[i];return null}
function dayName(s){
  if(s.dayId){var p=planOf(s.planId),d=dayOf(p,s.dayId);if(d)return d.name}
  return s.label||'';
}
function nextPlanDay(){
  var p=S.plans[0];if(!p||!p.days.length)return null;
  for(var i=S.ses.length-1;i>=0;i--){
    var s=S.ses[i];
    if(s.dayId&&s.planId===p.id&&isWorkout(s)){
      for(var j=0;j<p.days.length;j++)if(p.days[j].id===s.dayId)
        return {p:p,d:p.days[(j+1)%p.days.length],prev:p.days[j].name,on:s.date};
    }
  }
  return {p:p,d:p.days[0],prev:'',on:''};
}
function dowSuggest(d){
  var w=pd(d).getDay(),out=null;
  S.plans.forEach(function(p){
    if((p.rest||[]).indexOf(w)>=0&&!out)out={rest:true,p:p};
    p.days.forEach(function(x){if(x.dow===w)out={p:p,d:x}});
  });
  return out;
}

function targets(date){

  var days=(S.plans[0]&&S.plans[0].days.length)||5, ex=Math.max(0,Math.min(500,w*4.2));
  if(days>0&&days<7)tdee=b*(n(S.bio.act)||1.55)-ex*days/7+(tr?ex:0);
  var g=S.bio.goal, rate=Math.abs(n(S.bio.rate))||0.3;   /* kg per month */
  var adj=g==='gain'?rate*7700/30:g==='lose'?-rate*7700/30:0;
  if(g==='lose')adj=Math.max(adj,-tdee*0.25);            /* never crash-diet on his frame */
  if(g==='gain')adj=Math.min(adj,tdee*0.20);
  var kcal=Math.max(1200,tdee+adj);

  var pg=w*(g==='lose'?2.2:g==='gain'?1.9:1.7);
  var fg=Math.max(w*0.8,kcal*0.25/9);
  var cg=Math.max(0,(kcal-pg*4-fg*9)/4);
  var t={kcal:kcal,p:pg,f:fg,c:cg,
    fib:kcal/1000*(n(S.set.fibreK)||14),
    sug:kcal*0.10/4, sat:kcal*0.10/9,
    water:Math.max(1500,w*35+(tr?600:0))};

  return t;
}

function planTarget(exId){

function mealName(m){for(var i=0;i<MEALS.length;i++)if(MEALS[i][0]===m)return MEALS[i][1];return 'Snacks'}

function scaleV(fd,g){
  var out={},f=n(g)/100,v=(fd&&fd.v)||{};
  for(var k in v){var x=n(v[k])*f;if(x)out[k]=Math.round(x*1000)/1000}

function wtrOf(date){for(var i=0;i<S.wtr.length;i++)if(S.wtr[i].date===date)return n(S.wtr[i].ml);return 0}

function nUnit(k){return (NUTN[k]&&NUTN[k].u)||'g'}

/* decimals by size, not by unit - vitamin B1 sits at 1.2 mg and must not print as "1 mg of 1 mg" */
function nDec(k,v){

function fDays(from,to){

/* --- the best foods in the table for a given nutrient --- */
function bestFor(k,noSup){
  var out=[];
  allFoods().forEach(function(fd){
    if(noSup&&fd.grp==='Supplements')return;
    var per=n(fd.v[k])*n(fd.srv)/100;
    if(per>0)out.push({fd:fd,per:per});
  });
  out.sort(function(a,b){return b.per-a.per});
  return out.slice(0,3);
}
function gapList(tot,t){
  var out=[];
  NUT.forEach(function(x){
    var k=x[0];
    if(k==='kcal'||(NUTN[k]&&NUTN[k].lim))return;
    var tg=n(t[k]);if(!(tg>0))return;
    var f=n(tot[k])/tg;
    if(f<0.7)out.push({k:k,f:f,gap:tg-n(tot[k])});
  });
  out.sort(function(a,b){return a.f-b.f});
  return out;
}
function nutRow(k,v,tg,avgF){
  var lim=NUTN[k]&&NUTN[k].lim, f=tg>0?n(v)/tg:0;
  var col=lim?(f>1?'var(--bad)':f>0.85?'var(--warn)':'var(--ok)')
             :(f>=1?'var(--ok)':f>=0.6?'var(--acc)':'var(--warn)');
  var w=Math.max(0,Math.min(1,f))*100;
  return '<div style="margin-bottom:9px"><div class="dl">'+
    '<span class="grow sm b ell">'+esc(nName(k))+(lim?' <span class="xs mut">keep under</span>':'')+'</span>'+
    (avgF!=null?'<span class="xs mut" style="white-space:nowrap">7d '+fx(avgF*100,0)+'%</span>':'')+
    '<span class="p" style="color:'+col+'">'+fx(f*100,0)+'%</span></div>'+
    '<div class="gb" aria-hidden="true"><i style="width:'+fx(w,1)+'%;background:'+col+'"></i></div>'+
    '<div class="xs mut" style="margin-top:3px">'+esc(nAmt(k,v,tg))+' of '+esc(nAmt(k,tg))+'</div></div>';
}

/* --- what to eat next: names the shortfall and the food that closes it --- */
function foodGaps(tot,t,wk,nd){

function nutChips(v,t){
  var rows=[];
  NUT.forEach(function(x){
    var k=x[0];if(k==='kcal'||k==='p'||k==='c'||k==='f')return;
    var a=n(v[k]),tg=n(t[k]);if(!(a>0))return;

  });
  if(!rows.length)return '<div class="xs mut">Beyond the calories and macros above, this one carries nothing worth counting.</div>';
  rows.sort(function(a,b){return b.f-a.f});
  var h='<div class="ttl" style="margin-bottom:6px">And it adds these</div>';
  rows.forEach(function(r){
    var col=r.lim?'var(--warn)':r.f>=0.25?'var(--ok)':'var(--mut)';
    h+='<div class="dl" style="margin-bottom:5px"><span class="grow sm ell">'+esc(nName(r.k))+
      (r.lim?' <span class="xs mut">watch</span>':'')+'</span>'+

      '<span class="p" style="color:'+col+'">'+fx(r.f*100,0)+'%</span></div>';
  });
  return h+'<div class="xs mut" style="margin-top:7px">Percentages are of your whole day, not of this meal.</div>';

          function(){markBackedUp();render();toast('Backup saved - keep it somewhere off this phone')},
          function(err){

            if(dl(name,txt,'application/json'))markBackedUp();

          });

function backupDue(){

  var t0=new Date(S.set.lastBackup).getTime();
  if(!isFinite(t0))return {t:'No backup yet on this phone'};
  var since=Math.max(0,done-n(S.set.lastBackupN)),days=Math.floor((Date.now()-t0)/86400000);
  if(since>=3)return {t:since+' new session'+(since===1?'':'s')+' since your last backup'};
  if(days>=10)return {t:'Last backup was '+days+' days ago'};

function doImport(mode,txt){
  var inc=null;
  try{inc=JSON.parse(txt)}catch(e){toast('That is not a valid backup file');return}
  if(!inc||typeof inc!=='object'||!Array.isArray(inc.ses)){toast('That file has no sessions in it');return}
  mark('import');
  if(mode==='replace'){
    S=inc;norm();save();render();
    /* save() raises the banner itself if the write did not land - never claim a replace that only lives in memory */
    toast(storeBad?'Backup loaded, but this phone did not save it - read the warning at the top':'Replaced with the backup',true);
    return;
  }
  /* merge */
  var known={};S.ex.forEach(function(x){known[x.id]=1});
  (inc.ex||[]).forEach(function(x){if(x&&x.id&&!known[x.id]){known[x.id]=1;S.ex.push(x)}});
  var names={};S.plans.forEach(function(p){names[p.name]=1});
  (inc.plans||[]).forEach(function(p){if(p&&p.name&&!names[p.name]){p.id=p.id||uid();S.plans.push(p)}});
  var added=0,merged=0;
  inc.ses.forEach(function(s){
    if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s.date||''))return;
    var t=sesOf(s.date);
    if(!t){S.ses.push(s);added++;return}
    merged++;
    (s.ent||[]).forEach(function(e){
      var have=entOf(t,e.exId);
      if(have){                                  /* skip sets already there, so importing twice cannot double them */
        var sig={};have.sets.forEach(function(x){sig[setSig(x)]=1});
        (e.sets||[]).forEach(function(x){var k2=setSig(x);if(!sig[k2]){sig[k2]=1;have.sets.push(x)}});
      }
      else t.ent.push(e);
    });
    if(s.notes){var tn=String(t.notes||'');if(tn.indexOf(s.notes)<0)t.notes=(tn?tn+'\n':'')+s.notes}
  });
  var bwSig={};S.bw.forEach(function(b){bwSig[(b&&b.date)+'|'+n(b&&b.v)]=1});
  (inc.bw||[]).forEach(function(b){var k3=(b&&b.date)+'|'+n(b&&b.v);if(!bwSig[k3]){bwSig[k3]=1;S.bw.push(b)}});
  /* --- food: same idempotent trick, so importing the same backup twice cannot double a meal --- */
  var cfSig={};(S.cf||[]).forEach(function(x){cfSig[x&&x.id]=1});

function dedupeEx(){
  var byName={},dupes=0;
  mark('merge duplicate exercises');
  S.ex.forEach(function(x){
    var k=x.name.trim().toLowerCase();
    if(!byName[k])byName[k]=x;
    else{var keep=byName[k];
      S.ses.forEach(function(s){s.ent.forEach(function(e){if(e.exId===x.id)e.exId=keep.id})});
      S.plans.forEach(function(p){p.days.forEach(function(d){d.items.forEach(function(it){if(it.exId===x.id)it.exId=keep.id})})});
      x._gone=1;dupes++;}
  });
  S.ex=S.ex.filter(function(x){return !x._gone});
  repair();save();render();
  toast(dupes?('Merged '+dupes+' duplicate name'+(dupes===1?'':'s')):'No duplicate names found',dupes>0);

function setUnit(u){
  if(u===S.set.unit)return;
  var f=u==='lb'?2.2046226:1/2.2046226;
  mark('unit change');
  S.ses.forEach(function(s){s.ent.forEach(function(e){
    var k=exKind(e.exId);if(k==='t'||k==='c')return;          /* seconds and minutes are not weights */
    e.sets.forEach(function(x){if(n(x.w)>0)x.w=Math.round(n(x.w)*f*100)/100});
  })});
  S.bw.forEach(function(b){b.v=Math.round(n(b.v)*f*100)/100});
  if(n(S.set.bwDef)>0)S.set.bwDef=Math.round(n(S.set.bwDef)*f*10)/10;
  if(n(S.set.maxLoad)>0)S.set.maxLoad=Math.round(n(S.set.maxLoad)*f*10)/10;
  S.set.unit=u;save();render();toast('Converted every weight to '+u,true);
}

      openSheet(nm2,fPortionHTML(),'fport');
      toast('“'+nm2+'” saved to your food list');return true;
    case 'cf-del':
      var used=S.dl.some(function(e){return e.fid===i});
      var nmx='';S.cf.forEach(function(x){if(x.id===i)nmx=x.name});
      if(!confirm('Remove “'+nmx+'” from your food list?'+
        (used?'\n\nDays you already logged it keep their numbers - only new entries are affected.':'')))return true;
      S.cf=S.cf.filter(function(x){return x.id!==i});
      save();$('#sheetB').innerHTML=fPickHTML();render();toast('Removed from your list');return true;
    /* --- saved meals --- */
    case 'fm-add':
      var m2=null;S.fm.forEach(function(m){if(m.id===i)m2=m});
      if(!m2){toast('That meal is gone');return true}
      mark('add saved meal');
      var got=0,lost=0;
      m2.items.forEach(function(it){if(addFood(it.fid,it.g,it.meal||mealNow(),cur))got++;else lost++});
      save();closeSheet();render();
      toast(got?('Added '+got+' item'+(got===1?'':'s')+(lost?', '+lost+' no longer in your list':'')):'None of those foods are in your list any more',!!got);
      return true;
    case 'fm-del':
      var mn='';S.fm.forEach(function(m){if(m.id===i)mn=m.name});
      if(!confirm('Delete the saved meal “'+mn+'”? Days you already logged are not touched.'))return true;
      S.fm=S.fm.filter(function(m){return m.id!==i});
      save();$('#sheetB').innerHTML=fmListHTML();render();toast('Saved meal deleted');return true;
    case 'fm-save':
      var list2=dlOf(cur);
      if(!list2.length){toast('Nothing logged on this day');return true}
      var el2=$('#fmName'),nm3=el2?el2.value.trim():'';
      if(!nm3)nm3=dayName(sesOf(cur))||('Meal '+(S.fm.length+1));
      S.fm.push({id:uid(),name:nm3,items:list2.map(function(e){return {fid:e.fid,g:n(e.g),meal:e.meal}})});
      save();closeSheet();render();toast('Saved as “'+nm3+'” - add it in one tap from now on');return true;
    /* --- you --- */
    case 'bio-sex': S.bio.sex=(i==='f'?'f':'m');save();render();return true;
    case 'bio-goal': S.bio.goal=i;save();render();return true;
    case 'bw-save3':
      var bi=$('#bwIn3'),bv=bi?n(bi.value):0;
      if(!(bv>0)){toast('Type your weight first');return true}
      var f3=false;
      S.bw.forEach(function(b){if(b.date===cur){b.v=bv;f3=true}});
      if(!f3)S.bw.push({date:cur,v:bv});
      S.bw.sort(function(x,y){return x.date<y.date?-1:1});
      save();render();toast('Bodyweight '+fx(bv,1)+' '+U()+' saved for '+shortDate(cur)+' - your targets have moved with it');
      return true;
    case 'exp-food': expFood();return true;
  }
  return false;
}
function expFood(){
  var keys=['kcal','p','c','f','fib','sug','sat','na'];
  NUT.forEach(function(x){if(keys.indexOf(x[0])<0)keys.push(x[0])});
  var head=['date','meal','food','grams'];
  keys.forEach(function(k){head.push(nName(k)+' ('+nUnit(k)+')')});
  head.push('water_ml');
  var rows=[head];
  S.dl.forEach(function(e){
    var r=[e.date,mealName(e.meal),e.nm,n(e.g)];
    keys.forEach(function(k){r.push(n((e.v||{})[k]))});
    r.push('');rows.push(r);
  });
  S.wtr.forEach(function(w){
    if(!(n(w.ml)>0))return;
    var r=[w.date,'Water','Water',''];
    keys.forEach(function(){r.push('')});
    r.push(n(w.ml));rows.push(r);
  });
  if(rows.length===1){toast('Nothing logged to export yet');return}
  rows=[rows[0]].concat(rows.slice(1).sort(function(a,b){return a[0]<b[0]?-1:a[0]>b[0]?1:0}));
  dl('ironlog-food-'+stamp2()+'.csv',rows.map(function(r){return r.map(csvCell).join(',')}).join('\r\n'),'text/csv');
}
function actData(a,i){
  switch(a){
    case 'unit': setUnit(i);return true;
    case 'theme': S.set.theme=i;save();render();return true;
    case 'exp-json': expJSON();return true;
    case 'backup-now': backupNow();return true;
    case 'snap-load':
      var raw='';try{raw=localStorage.getItem(i)||''}catch(e){}
      if(!raw){toast('That copy is not on this phone any more');return true}
      if(!confirm('Go back to the copy saved on '+String(i).slice(SNAP.length)+'?\n\nEverything logged after that is replaced. You can undo straight after.'))return true;
      doImport('replace',raw);return true;
    case 'exp-csv': expCSV();return true;
    case 'copy-json':
      flush();var txt=JSON.stringify(S);
      if(navigator.clipboard&&navigator.clipboard.writeText)
        navigator.clipboard.writeText(txt).then(function(){okCopy()},function(){if(legacyCopy(txt))okCopy()});
      else if(legacyCopy(txt))okCopy();
      return true;
    case 'imp-merge': readImport(function(t){doImport('merge',t)});return true;
    case 'imp-replace':
      if(!confirm('Replace everything on this device with the backup?'))return true;
      readImport(function(t){doImport('replace',t)});return true;
    case 'clean-empty': cleanEmpty();return true;
    case 'dedupe-ex': dedupeEx();return true;
    case 'repair':
      var fixed=repair();save();render();
      toast(fixed?('Merged '+fixed+' duplicate date'+(fixed===1?'':'s')):'Calendar is already clean - one session per date');
      return true;
    case 'wipe':
      if(!confirm('Delete every session, plan and setting on this device? Export a backup first if you are not sure.'))return true;
      if(!confirm('Last check: this cannot be undone once you close the app. Delete everything?'))return true;
      mark('wipe');S=seed();save();cur=today();calM=cur.slice(0,7);view='home';render();
      toast('Everything deleted',true);return true;
  }
  return false;
}
function okCopy(){markBackedUp();render();toast('Backup copied - paste it into Notes, a mail to yourself, or a file in iCloud Drive')}
function legacyCopy(txt){
  try{
    var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.focus();ta.select();
    var ok=document.execCommand('copy');document.body.removeChild(ta);
    if(!ok)toast('Could not copy - use the .json file instead');
    return !!ok;
  }catch(e){toast('Could not copy - use the .json file instead');return false}
}
/* ============ typing ============ */
function refocus(sel){
  var el=$(sel);if(!el)return;
  try{el.focus();var v=el.value.length;el.setSelectionRange(v,v)}catch(e){}
}
function onInput(ev){
  var el=ev.target;if(!el||!el.getAttribute)return;
  if(el.id==='progQ'){progQ=el.value;render();refocus('#progQ');return}
  if(el.id==='pickQ'){pickQ=el.value;$('#sheetB').innerHTML=pickerHTML();refocus('#pickQ');return}
  if(el.id==='fq'){fq=el.value;$('#sheetB').innerHTML=fPickHTML();refocus('#fq');return}
  if(el.id==='fmName')return;   /* read on save, no re-render while he types */
  var f=el.getAttribute('data-f');if(!f)return;
  var ty=ev.type;   /* 'input' while typing, 'change' when he leaves the box - recompute then */
  var i=el.getAttribute('data-i'),j=el.getAttribute('data-j'),k=el.getAttribute('data-k');
  var s=sesOf(cur),e=s?s.ent[+i]:null,p=planOf(i),d=p?dayOf(p,j):null,it=d?d.items[+k]:null;
  switch(f){
    case 'w': case 'r':
      if(!e||!e.sets[+j])return;
      e.sets[+j][f]=el.value===''?'':n(el.value);saveSoon();return;
    case 'enote': if(e){e.note=el.value;saveSoon()}return;
    case 'notes': if(s){s.notes=el.value;saveSoon()}return;
    case 'rest': S.set.rest=Math.max(10,Math.min(600,n(el.value)||90));saveSoon();return;
    case 'autoRest': case 'prefill': case 'autoBackup': S.set[f]=!!el.checked;save();return;
    case 'bwLoad': S.set.bwLoad=!!el.checked;save();render();return;
    case 'maxLoad': S.set.maxLoad=Math.max(0,n(el.value));saveSoon();return;
    case 'bwDef': S.set.bwDef=Math.max(0,n(el.value));saveSoon();return;
    case 'grpGoal': S.set.grpGoal=Math.max(0,Math.min(40,n(el.value)));saveSoon();return;
    case 'pname': if(p){p.name=el.value;saveSoon()}return;
    case 'dname': if(d){d.name=el.value;saveSoon()}return;
    case 'ddow': if(d){d.dow=+el.value;save()}return;
    case 'isets': if(it){it.sets=Math.max(1,Math.min(12,n(el.value)||3));saveSoon()}return;
    case 'ilo': if(it){it.lo=Math.max(1,n(el.value)||8);saveSoon()}return;
    case 'ihi': if(it){it.hi=Math.max(n(it.lo)||1,n(el.value)||12);saveSoon()}return;
    /* --- food --- */
    case 'fg':
      fG=Math.max(1,Math.min(4000,Math.round(n(el.value))||1));
      if(ty==='change'){$('#sheetB').innerHTML=fPortionHTML();refocus('#fgIn')}
      return;
    case 'cf':
      if(!cfD)return;
      if(i==='name'||i==='sl'||i==='grp')cfD[i]=el.value;
      else cfD[i]=Math.max(0,n(el.value));
      return;
    case 'bAge': S.bio.age=Math.max(12,Math.min(99,Math.round(n(el.value))||27));
      saveSoon();if(ty==='change')render();return;
    case 'bHt': S.bio.ht=Math.max(120,Math.min(230,n(el.value)||183));
      saveSoon();if(ty==='change')render();return;
    case 'bAct': S.bio.act=Math.max(1.2,Math.min(2.2,n(el.value)||1.55));save();render();return;
    case 'bRate': S.bio.rate=Math.max(0,Math.min(3,n(el.value)));
      saveSoon();if(ty==='change')render();return;
    case 'fibreK': S.set.fibreK=Math.max(0,Math.min(30,n(el.value)));
      saveSoon();if(ty==='change')render();return;
    case 'water': S.set.water=Math.max(0,Math.min(8000,Math.round(n(el.value))));
      saveSoon();if(ty==='change')render();return;
    case 'diet': S.set.diet=!!el.checked;save();render();return;
  }
}
document.addEventListener('input',onInput);
document.addEventListener('change',onInput);
/* ============ start ============ */
function boot(){
  load();
  if(n(S.rest.end)>0&&n(S.rest.end)-Date.now()<-4000)S.rest={end:0,len:0};
  applyTheme();
  render();
  stamp(S.ses.length?'Loaded':'Ready - nothing logged yet');
}
try{boot();window.__up=true}   /* __up tells the error reporter above that the app is alive, so a
                                 later error gets a small dismissible bar instead of the screen */
catch(err){
  /* Last line of defence. Your log is still sitting in this phone's storage even if this
     build cannot read it, so put it on screen where it can be copied out rather than
     leaving a blank page with no way back. */
  var raw='';try{raw=localStorage.getItem(KEY)||''}catch(e9){}
  var nv=document.getElementById('nav');if(nv)nv.hidden=true;   /* nothing to navigate to - keep him on this message */
  var box=document.getElementById('v-home');
  if(box){
    var sec=document.getElementsByTagName('section');
    for(var q=0;q<sec.length;q++){sec[q].hidden=(sec[q].id!=='v-home')}
    box.innerHTML='<div class="card"><div class="ttl">This page could not start</div>'+
      '<div class="sm" style="margin-top:8px">Your log has NOT been deleted - it is still in this '+
      'phone\'s storage, and the text below is all of it. Copy it somewhere safe first, then reload '+
      'this page. If it still fails, open a fresh copy of the tracker and use More → Backup → Restore, '+
      'pasting that text in.</div>'+
      '<div class="xs mut" style="margin-top:8px">Error: '+esc(String(err&&err.message||err))+'</div>'+
      (raw?'<textarea readonly style="margin-top:10px;min-height:150px" aria-label="Your backup text">'+
        esc(raw)+'</textarea><div class="xs mut" style="margin-top:6px">'+raw.length+
        ' characters. Tap the box, select all, copy.</div>':
        '<div class="sm" style="margin-top:10px">Storage came back empty, so there was nothing saved on this phone yet.</div>')+
      '</div>';
    /* Claim the screen the instant the card exists, not after stamp() below. If anything between
       here and there throws, __up and __shown would both stay false and a later async error would
       cover this card - which holds the only readable copy of his log. */
    window.__shown=true;
  }
  stamp('⚠ Failed to start');
  window.__shown=true;   /* also for the no-#v-home path, where the card above never got built */
}

/* ============ home screen app ============ */
/* Only runs on a real origin. Opened as a plain file there is no service worker, no install and
   no point pretending - everything above works either way, this block just makes the hosted copy
   survive with no internet. Every toast here passes no second argument on purpose: the second
   argument shows the Undo button, which is wired to doUndo() and would restore an unrelated
   snapshot. */
(function(){
  var real=(location.protocol==='https:')||location.hostname==='localhost'||location.hostname==='127.0.0.1';
  if(!real)return;
  /* Safari clears script-writable storage for a site left alone for 7 days. A Home Screen app is
     exempt from that, and this asks for the exemption explicitly where it is supported. */
  try{if(navigator.storage&&navigator.storage.persist){
    var pp=navigator.storage.persist();
    if(pp&&pp['catch'])pp['catch'](function(){});   /* Safari may not implement it - do not leave a rejection loose */
  }}catch(e){}
  if('serviceWorker' in navigator){
    try{
      navigator.serviceWorker.register('sw.js').then(function(reg){
        reg.addEventListener('updatefound',function(){
          var w=reg.installing;if(!w)return;
          w.addEventListener('statechange',function(){
            /* controller already set means this is a replacement, not the first install */
            if(w.state==='installed'&&navigator.serviceWorker.controller)
              toast('New version installed - close and reopen IRONLOG');
          });
        });
      })['catch'](function(){});   /* quoted: catch is a reserved word in ES3 member position */
    }catch(e){}
    /* Visible proof the cache actually filled. Without this there is no way to tell, from the
       phone, whether a launch is being served by the worker or by the network - which is exactly
       the thing that goes wrong. Fires once the worker controls the page AND the page itself is
       in the cache; anything short of that means offline will fail. */
    try{
      navigator.serviceWorker.ready.then(function(){
        if(!navigator.serviceWorker.controller){
          toast('Offline not ready yet - close and reopen IRONLOG once, still online');
          return;
        }
        caches.match('./gym-tracker.html',{ignoreSearch:true}).then(function(m){
          if(m){ if(!sessionStorage.getItem('ironlog.okoff')){
            sessionStorage.setItem('ironlog.okoff','1');
            toast('Offline ready - you can turn the internet off');
          }}
          else toast('Offline NOT ready - page did not cache');
        })['catch'](function(){});
      })['catch'](function(){});
    }catch(e){}
  }else{
    try{toast('This browser has no service worker - offline will not work')}catch(e){}
  }
  /* One nudge, ever. In a Safari tab this is a website iOS may eventually clear; on the Home
     Screen it is an app. */
  try{
    if(!navigator.standalone&&!localStorage.getItem('ironlog.a2hs')){
      localStorage.setItem('ironlog.a2hs','1');
      setTimeout(function(){toast('Tap Share → Add to Home Screen so this works with no internet')},1800);
    }
  }catch(e){}
})();
